version: 1
mode: development
runtime_image: node:22-alpine
hot_reload: true
debug_ports: true
health_path: /health
debug_container_port: 9229
dev_command: "node --watch --inspect=0.0.0.0:9229 scripts/dev/p1-dev-service.mjs"
services:
  platform-api:
    role: platform-api
    source: product/api
    command: "node --watch --inspect=0.0.0.0:9229 scripts/dev/p1-dev-service.mjs"
    container_port: 8080
    health_path: /health
    hot_reload: true
    debug: true
    public: true
  web-console:
    role: web-console
    source: product/web-console
    command: "node --watch --inspect=0.0.0.0:9229 scripts/dev/p1-dev-service.mjs"
    container_port: 3000
    health_path: /health
    hot_reload: true
    debug: true
    public: true
  openclaw-adapter:
    role: gateway-adapter
    source: platform/adapters/openclaw
    command: "node --watch --inspect=0.0.0.0:9229 scripts/dev/p1-dev-service.mjs"
    container_port: 8080
    health_path: /health
    hot_reload: true
    debug: true
    public: false
  dsh-adapter:
