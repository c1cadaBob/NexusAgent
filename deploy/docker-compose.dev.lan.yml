name: nexusagent-dev-lan

services:
  platform-api:
    command: ["node", "--watch", "--experimental-strip-types", "--inspect=0.0.0.0:9229", "product/api/server.mjs"]
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      NEXUS_RUNTIME_MODE: distributed
      NEXUS_INTERNAL_SERVICE_TOKEN: ${NEXUS_INTERNAL_SERVICE_TOKEN:-nexus-dev-internal-token}
      NEXUS_OPENCLAW_ADAPTER_URL: http://openclaw-adapter:8080
      NEXUS_HERMES_ADAPTER_URL: http://hermes-adapter:8080
      NEXUS_DSH_ADAPTER_URL: http://dsh-adapter:8080
      NEXUS_MEMORY_GATEWAY_URL: http://memory-gateway:8080
      NEXUS_ARTIFACT_STORE_URL: http://artifact-store:8080
      NEXUS_EVENT_BUS_URL: http://event-bus:8080
      NEXUS_CREDENTIAL_CENTER_URL: http://credential-center:8080
      NEXUS_OBSERVABILITY_URL: http://observability:9090
    ports: !override
      - "${NEXUS_LAN_BIND_ADDRESS:-0.0.0.0}:3050:8080"
      - "127.0.0.1:9250:9229"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/v1/health').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web-console:
    command: ["sh", "-c", "corepack pnpm --dir /workspace/product/web-console install --frozen-lockfile --store-dir /workspace/product/web-console/node_modules/.pnpm-store && cd /workspace/product/web-console && node --inspect=0.0.0.0:9229 node_modules/vite/bin/vite.js --host 0.0.0.0 --port 5175"]
    environment:
      HOST: "0.0.0.0"
      PORT: "5175"
      NEXUS_DEV_BIND_ADDRESS: "0.0.0.0"
      VITE_NEXUS_API_BASE_URL: ""
    ports: !override
      - "${NEXUS_LAN_BIND_ADDRESS:-0.0.0.0}:3051:5175"
      - "127.0.0.1:9251:9229"
    volumes: !override
      - type: bind
        source: ../product/web-console/package.json
        target: /workspace/product/web-console/package.json
        read_only: true
      - type: bind
        source: ../product/web-console/pnpm-lock.yaml
        target: /workspace/product/web-console/pnpm-lock.yaml
        read_only: true
      - type: bind
        source: ../product/web-console/tsconfig.json
        target: /workspace/product/web-console/tsconfig.json
        read_only: true
      - type: bind
        source: ../product/web-console/vite.config.ts
        target: /workspace/product/web-console/vite.config.ts
        read_only: true
      - type: bind
        source: ../product/web-console/index.html
        target: /workspace/product/web-console/index.html
        read_only: true
      - type: bind
        source: ../product/web-console/src
        target: /workspace/product/web-console/src
      - type: volume
        source: web-console-node-modules
        target: /workspace/product/web-console/node_modules
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5175/').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));\""]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 25s

  openclaw-adapter:
    command: ["node", "--watch", "--experimental-strip-types", "--inspect=0.0.0.0:9229", "scripts/dev/internal-service.mjs"]
    environment:
      NEXUS_INTERNAL_SERVICE_TOKEN: ${NEXUS_INTERNAL_SERVICE_TOKEN:-nexus-dev-internal-token}

  hermes-adapter:
    command: ["node", "--watch", "--experimental-strip-types", "--inspect=0.0.0.0:9229", "scripts/dev/internal-service.mjs"]
    environment:
      NEXUS_INTERNAL_SERVICE_TOKEN: ${NEXUS_INTERNAL_SERVICE_TOKEN:-nexus-dev-internal-token}

  dsh-adapter:
    command: ["node", "--watch", "--experimental-strip-types", "--inspect=0.0.0.0:9229", "scripts/dev/internal-service.mjs"]
    environment:
      NEXUS_INTERNAL_SERVICE_TOKEN: ${NEXUS_INTERNAL_SERVICE_TOKEN:-nexus-dev-internal-token}

  memory-gateway:
    command: ["node", "--watch", "--experimental-strip-types", "--inspect=0.0.0.0:9229", "scripts/dev/internal-service.mjs"]
    environment:
      NEXUS_INTERNAL_SERVICE_TOKEN: ${NEXUS_INTERNAL_SERVICE_TOKEN:-nexus-dev-internal-token}

  artifact-store:
    command: ["node", "--watch", "--experimental-strip-types", "--inspect=0.0.0.0:9229", "scripts/dev/internal-service.mjs"]
    environment:
      NEXUS_INTERNAL_SERVICE_TOKEN: ${NEXUS_INTERNAL_SERVICE_TOKEN:-nexus-dev-internal-token}

  event-bus:
    command: ["node", "--watch", "--experimental-strip-types", "--inspect=0.0.0.0:9229", "scripts/dev/internal-service.mjs"]
    environment:
      NEXUS_INTERNAL_SERVICE_TOKEN: ${NEXUS_INTERNAL_SERVICE_TOKEN:-nexus-dev-internal-token}

  credential-center:
    command: ["node", "--watch", "--experimental-strip-types", "--inspect=0.0.0.0:9229", "scripts/dev/internal-service.mjs"]
    environment:
      NEXUS_INTERNAL_SERVICE_TOKEN: ${NEXUS_INTERNAL_SERVICE_TOKEN:-nexus-dev-internal-token}

  observability:
    command: ["node", "--watch", "--experimental-strip-types", "--inspect=0.0.0.0:9229", "scripts/dev/internal-service.mjs"]
    environment:
      NEXUS_INTERNAL_SERVICE_TOKEN: ${NEXUS_INTERNAL_SERVICE_TOKEN:-nexus-dev-internal-token}

volumes:
  web-console-node-modules:
    name: nexusagent-dev-lan-web-console-node-modules
