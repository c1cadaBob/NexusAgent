apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
  namespace: nexusagent-prod
  labels:
    app.kubernetes.io/name: nexusagent
    app.kubernetes.io/component: platform-api
    nexus.service.public: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: nexusagent
      app.kubernetes.io/component: platform-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexusagent
        app.kubernetes.io/component: platform-api
        nexus.service.public: "true"
    spec:
      serviceAccountName: platform-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: platform-api
          image: ghcr.io/c1cadabob/nexusagent-platform-api:p8-template
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: NEXUS_SERVICE_NAME
              value: platform-api
            - name: NEXUS_SERVICE_PUBLIC
              value: "true"
          envFrom:
            - configMapRef:
                name: nexusagent-prod-config
            - secretRef:
                name: nexusagent-prod-secret-template
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
