apiVersion: v1
kind: Service
metadata:
  name: platform-api
  namespace: nexusagent-prod
  labels:
    app.kubernetes.io/name: nexusagent
    app.kubernetes.io/component: platform-api
    nexus.service.public: "true"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nexusagent
    app.kubernetes.io/component: platform-api
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
