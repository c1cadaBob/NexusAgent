name: nexusagent-dev

x-nexus-dev-service: &nexus-dev-service
  image: node:22-alpine
  working_dir: /workspace
  command: ["node", "--watch", "--inspect=0.0.0.0:9229", "scripts/dev/p1-dev-service.mjs"]
  restart: unless-stopped
  init: true
  volumes:
    - type: bind
      source: ../platform
      target: /workspace/platform
    - type: bind
      source: ../product
      target: /workspace/product
    - type: bind
      source: ../scripts
      target: /workspace/scripts
    - type: bind
      source: ../config
      target: /workspace/config
  healthcheck:
    test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:' + process.env.PORT + '/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));\""]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 5s
  networks:
    - nexus-dev-internal

services:
  platform-api:
    <<: *nexus-dev-service
    environment:
      NEXUS_SERVICE_NAME: platform-api
      NEXUS_PUBLIC: "true"
      NEXUS_HOT_RELOAD: "true"
      NEXUS_DEBUG_PORT: "9250"
      PORT: "8080"
    ports:
      - "3050:8080"
      - "127.0.0.1:9250:9229"
    labels:
      nexus.service.role: platform-api
      nexus.service.public: "true"
      nexus.dev.hot_reload: "true"

  web-console:
    <<: *nexus-dev-service
    environment:
      NEXUS_SERVICE_NAME: web-console
      NEXUS_PUBLIC: "true"
