name: P8 Release Gate

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  NEXUS_RELEASE_GATE_SCHEMA: nexus.release_gate.p8.v1
  NEXUS_RELEASE_BEHAVIOR: tag_push_ghcr
  NEXUS_PROMOTION_STRATEGY: canary_first
  NEXUS_UPSTREAM_CHECK_MODE: optional_remote
  NEXUS_IMAGE_PUBLISH_SCOPE: real_runtime_only
  NEXUS_IMAGE_NAMESPACE: ghcr.io/c1cadabob/nexusagent

jobs:
  quality-gate:
    name: P8 quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate planning and release gate
        run: |
          scripts/planning/generate-task-prompts.py --check
          git diff --check
          git diff --check -- . ':!vendor/**'
          node scripts/quality/validate-p8-release-gate.mjs
          node scripts/upstream-tracking/validate-provider-compatibility.mjs
          node scripts/upstream-tracking/weekly-upstream-check.mjs

      - name: Run P8 release targeted tests
        run: |
          node --test tests/deployment/p8-release-gate.test.mjs tests/deployment/p8-provider-compatibility.test.mjs tests/security/p8-release-supply-chain.test.mjs
          node --test tests/deployment/p8-production-orchestration.test.mjs tests/security/p8-production-isolation.test.mjs
          node --test tests/security/dsh-network-isolation.test.mjs tests/security/hermes-network-isolation.test.mjs tests/security/openclaw-network-isolation.test.mjs

      - name: Run phase smoke gates
        run: |
          bash tests/smoke/P0.sh
          bash tests/smoke/P1.sh
          bash tests/smoke/P2.sh
          bash tests/smoke/P3.sh
          bash tests/smoke/P4.sh
          bash tests/smoke/P5.sh
          bash tests/smoke/P6.sh
          bash tests/smoke/P7.sh
          node - <<'NODE'
          const { existsSync, rmSync } = require('node:fs');
          for (const path of [
            'product/sdk/node_modules',
            'product/sdk/dist',
            'product/web-console/node_modules',
            'product/web-console/dist',
            'product/docs-site/node_modules',
            'product/docs-site/dist',
          ]) {
            if (existsSync(path)) rmSync(path, { recursive: true, force: true });
          }
          console.log('P8-02_GENERATED_ARTIFACT_CLEANUP: removed local build outputs before P8 supply-chain scan.');
          NODE
          bash tests/smoke/P8.sh

      - name: Generate candidate release manifest
        run: node scripts/upstream-tracking/generate-release-manifest.mjs > release-manifest.p8.json

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: p8-candidate-release-manifest
          path: release-manifest.p8.json

  build-and-push-ghcr:
    name: Build and push GHCR candidate images
    runs-on: ubuntu-latest
    needs: quality-gate
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: platform-api
            image: ghcr.io/c1cadabob/nexusagent/platform-api
            dockerfile: deploy/docker/platform-api.Dockerfile
          - service: web-console
            image: ghcr.io/c1cadabob/nexusagent/web-console
            dockerfile: deploy/docker/web-console.Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ matrix.image }}:${{ github.ref_name }}
            ${{ matrix.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=NexusAgent ${{ matrix.service }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            nexus.release.gate=P8-02
            nexus.release.promotion=canary_first

      - name: Confirm canary-only promotion boundary
        run: |
          echo 'P8-02_RELEASE_PAUSE_CANARY_ONLY: GHCR candidate images published; production default promotion stays blocked until canary review and rollback confirmation.'
