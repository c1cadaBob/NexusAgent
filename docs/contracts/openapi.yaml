openapi: 3.1.0
info:
  title: NexusAgent Platform API
  version: 0.5.0-p5
  summary: Unified public REST API for NexusAgent platform resources.
  description: >-
    P5 REST MVP of the public NexusAgent API. The contract exposes only platform
    resources: tasks, attempts, executions, skills, capabilities, memory,
    skill evaluations, tenants, approvals, channel management, plugin governance, artifacts, audit references, and
    health. Internal implementation details, internal component brands, raw
    endpoint references, internal error identifiers, and internal storage
    locations are intentionally excluded. P5-04 TypeScript SDK and developer
    docs consume this contract as the only public API source. P5 Alpha event
    reads use /v1/tasks/{task_id}/events; webhook delivery and streaming
    transports are deferred.
  license:
    name: Internal planning draft
    identifier: LicenseRef-NexusAgent-Planning-Draft
servers:
  - url: https://api.nexusagent.local
    description: Platform API base URL placeholder for deployment-specific routing
security:
  - bearerAuth: []
tags:
  - name: health
    description: Platform liveness and readiness checks.
  - name: tasks
    description: Task submission, state, cancellation, retry, and event reads.
  - name: skills
    description: Platform skill catalog operations.
  - name: capabilities
    description: Approved platform capabilities available to callers.
  - name: skill-evaluations
    description: Administrator-triggered deterministic skill regression checks.
  - name: memory
    description: Memory access through the platform memory gateway.
  - name: tenants
    description: Tenant administration and visibility.
  - name: permissions
    description: Platform permission catalog.
  - name: approvals
    description: Human or policy approval workflow.
  - name: budget
    description: Platform budget admission checks.
  - name: channels
    description: Tenant channel configuration and connection dry-run checks.
  - name: plugin-governance
    description: Administrator-only plugin inventory and admission workflow.
paths:
  /v1/health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Read platform health.
      security: []
      responses:
        '200':
          description: Platform is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '429':
          $ref: '#/components/responses/PlatformError'
        '503':
          $ref: '#/components/responses/PlatformError'
  /v1/tasks:
    post:
      tags: [tasks]
      operationId: createTask
      summary: Submit a platform task.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskRequest'
      responses:
        '202':
          description: Task accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/PlatformError'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
        '409':
          $ref: '#/components/responses/PlatformError'
    get:
      tags: [tasks]
      operationId: listTasks
      summary: List tasks visible to the caller.
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
        - $ref: '#/components/parameters/StateQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CursorQuery'
      responses:
        '200':
          description: Task list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskList'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
  /v1/tasks/{task_id}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [tasks]
      operationId: getTask
      summary: Read a task and its current platform state.
      responses:
        '200':
          description: Task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
        '404':
          $ref: '#/components/responses/PlatformError'
  /v1/tasks/{task_id}/cancel:
    post:
      tags: [tasks]
      operationId: cancelTask
      summary: Request cancellation of the active task attempt.
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCancelRequest'
      responses:
        '202':
          description: Cancellation accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/PlatformError'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
        '404':
          $ref: '#/components/responses/PlatformError'
        '409':
          $ref: '#/components/responses/PlatformError'
  /v1/tasks/{task_id}/retry:
    post:
      tags: [tasks]
      operationId: retryTask
      summary: Start a new attempt for a retryable task.
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskRetryRequest'
      responses:
        '202':
          description: Retry accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
        '404':
          $ref: '#/components/responses/PlatformError'
        '409':
          $ref: '#/components/responses/PlatformError'
  /v1/tasks/{task_id}/events:
    get:
      tags: [tasks]
      operationId: listTaskEvents
      summary: List platform events for one task.
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CursorQuery'
      responses:
        '200':
          description: Task event list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventList'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
        '404':
          $ref: '#/components/responses/PlatformError'
  /v1/skills:
    get:
      tags: [skills]
      operationId: listSkills
      summary: List platform skills.
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CursorQuery'
      responses:
        '200':
          description: Skill list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillList'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
  /v1/capabilities:
    get:
      tags: [capabilities]
      operationId: listCapabilities
      summary: List approved platform capabilities visible to the caller.
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CursorQuery'
      responses:
        '200':
          description: Capability list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityList'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
  /v1/skill-evaluations/config:
    get:
      tags: [skill-evaluations]
      operationId: getSkillEvaluationConfig
      summary: Read tenant skill evaluation configuration.
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
        - name: trace_id
          in: query
          schema:
            $ref: '#/components/schemas/TraceId'
      responses:
        '200':
          description: Skill evaluation configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillEvaluationConfig'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
    patch:
      tags: [skill-evaluations]
      operationId: updateSkillEvaluationConfig
      summary: Enable or disable manual skill evaluation for one tenant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillEvaluationConfigUpdateRequest'
      responses:
        '200':
          description: Updated skill evaluation configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillEvaluationConfig'
        '400':
          $ref: '#/components/responses/PlatformError'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
  /v1/skill-evaluations/runs:
    post:
      tags: [skill-evaluations]
      operationId: runSkillEvaluation
      summary: Run deterministic skill evaluation manually.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillEvaluationRunRequest'
      responses:
        '202':
          description: Skill evaluation run completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillEvaluationRunReport'
        '400':
          $ref: '#/components/responses/PlatformError'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
    get:
      tags: [skill-evaluations]
      operationId: listSkillEvaluationRuns
      summary: List skill evaluation runs visible to the administrator.
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CursorQuery'
      responses:
        '200':
          description: Skill evaluation run list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillEvaluationRunList'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
  /v1/skill-evaluations/runs/{run_id}:
    get:
      tags: [skill-evaluations]
      operationId: getSkillEvaluationRun
      summary: Read one skill evaluation report.
      parameters:
        - $ref: '#/components/parameters/SkillEvaluationRunId'
        - $ref: '#/components/parameters/TenantIdQuery'
      responses:
        '200':
          description: Skill evaluation run report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillEvaluationRunReport'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
        '404':
          $ref: '#/components/responses/PlatformError'
  /v1/memory/search:
    post:
      tags: [memory]
      operationId: searchMemory
      summary: Search memory through the platform gateway.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemorySearchRequest'
      responses:
        '200':
          description: Memory search results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemorySearchResultList'
        '400':
          $ref: '#/components/responses/PlatformError'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
  /v1/memory:
    post:
      tags: [memory]
      operationId: writeMemory
      summary: Write memory through the platform gateway.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryWriteRequest'
      responses:
        '201':
          description: Memory record written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryRecord'
        '400':
          $ref: '#/components/responses/PlatformError'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
  /v1/memory/retention:
    get:
      tags: [memory]
      operationId: getMemoryRetentionPolicy
      summary: Read tenant memory retention policy.
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
        - name: trace_id
          in: query
          schema:
            $ref: '#/components/schemas/TraceId'
      responses:
        '200':
          description: Memory retention policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryRetentionPolicy'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
    patch:
      tags: [memory]
      operationId: updateMemoryRetentionPolicy
      summary: Update tenant memory retention policy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryRetentionPolicyUpdateRequest'
      responses:
        '200':
          description: Updated memory retention policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryRetentionPolicy'
        '400':
          $ref: '#/components/responses/PlatformError'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
  /v1/memory/retention/sweep:
    post:
      tags: [memory]
      operationId: sweepMemoryRetention
      summary: Run a manual memory retention sweep.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryRetentionSweepRequest'
      responses:
        '200':
          description: Memory retention sweep result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryRetentionSweepResult'
        '400':
          $ref: '#/components/responses/PlatformError'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
  /v1/memory/{memory_id}/delete:
    post:
      tags: [memory]
      operationId: deleteMemory
      summary: Soft delete a memory record through the platform gateway.
      parameters:
        - name: memory_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^memory_'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryDeleteRequest'
      responses:
        '200':
          description: Memory delete result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryDeleteResult'
        '400':
          $ref: '#/components/responses/PlatformError'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
        '404':
          $ref: '#/components/responses/PlatformError'
  /v1/tenants:
    get:
      tags: [tenants]
      operationId: listTenants
      summary: List tenants visible to an administrator.
      parameters:
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CursorQuery'
      responses:
        '200':
          description: Tenant list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantList'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
  /v1/tenants/{tenant_id}/users:
    get:
      tags: [tenants]
      operationId: listTenantUsers
      summary: List users for one tenant.
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/TenantId'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CursorQuery'
      responses:
        '200':
          description: Tenant user list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantUserList'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
        '404':
          $ref: '#/components/responses/PlatformError'
  /v1/permissions:
    get:
      tags: [permissions]
      operationId: listPermissions
      summary: List platform permission names.
      responses:
        '200':
          description: Permission list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionList'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
  /v1/approvals:
    get:
      tags: [approvals]
      operationId: listApprovals
      summary: List approvals visible to the caller.
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CursorQuery'
      responses:
        '200':
          description: Approval list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalList'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
  /v1/approvals/{approval_id}/decision:
    post:
      tags: [approvals]
      operationId: decideApproval
      summary: Approve or reject a pending approval.
      parameters:
        - $ref: '#/components/parameters/ApprovalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecisionRequest'
      responses:
        '200':
          description: Updated approval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
        '400':
          $ref: '#/components/responses/PlatformError'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
        '404':
          $ref: '#/components/responses/PlatformError'
        '409':
          $ref: '#/components/responses/PlatformError'
  /v1/budget/check:
    post:
      tags: [budget]
      operationId: checkBudget
      summary: Check platform budget admission for a requested operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetCheckRequest'
      responses:
        '200':
          description: Budget decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetCheckResult'
        '400':
          $ref: '#/components/responses/PlatformError'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
        '429':
          $ref: '#/components/responses/PlatformError'
  /v1/channels:
    get:
      tags: [channels]
      operationId: listChannels
      summary: List channel configurations visible to the caller.
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CursorQuery'
      responses:
        '200':
          description: Channel configuration list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelConfigList'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
    post:
      tags: [channels]
      operationId: createChannel
      summary: Create a tenant channel configuration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelConfigCreateRequest'
      responses:
        '201':
          description: Channel configuration created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelConfig'
        '400':
          $ref: '#/components/responses/PlatformError'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
        '409':
          $ref: '#/components/responses/PlatformError'
  /v1/channels/{channel_config_id}:
    parameters:
      - $ref: '#/components/parameters/ChannelConfigId'
    get:
      tags: [channels]
      operationId: getChannel
      summary: Read one channel configuration.
      responses:
        '200':
          description: Channel configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelConfig'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
        '404':
          $ref: '#/components/responses/PlatformError'
    patch:
      tags: [channels]
      operationId: updateChannel
      summary: Update editable channel configuration fields.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelConfigUpdateRequest'
      responses:
        '200':
          description: Updated channel configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelConfig'
        '400':
          $ref: '#/components/responses/PlatformError'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
        '404':
          $ref: '#/components/responses/PlatformError'
  /v1/channels/{channel_config_id}/status:
    post:
      tags: [channels]
      operationId: setChannelStatus
      summary: Enable or disable one channel configuration.
      parameters:
        - $ref: '#/components/parameters/ChannelConfigId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelConfigStatusRequest'
      responses:
        '200':
          description: Updated channel configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelConfig'
        '400':
          $ref: '#/components/responses/PlatformError'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
        '404':
          $ref: '#/components/responses/PlatformError'
        '409':
          $ref: '#/components/responses/PlatformError'
  /v1/channels/{channel_config_id}/test:
    post:
      tags: [channels]
      operationId: testChannelConnection
      summary: Run a platform dry-run connection check for one channel configuration.
      parameters:
        - $ref: '#/components/parameters/ChannelConfigId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelConnectionTestRequest'
      responses:
        '200':
          description: Channel dry-run result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelConnectionTestResult'
        '400':
          $ref: '#/components/responses/PlatformError'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
        '404':
          $ref: '#/components/responses/PlatformError'
        '409':
          $ref: '#/components/responses/PlatformError'
  /v1/admin/plugins:
    get:
      tags: [plugin-governance]
      operationId: listPluginInventory
      summary: List plugin inventory entries for platform administrators.
      parameters:
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CursorQuery'
      responses:
        '200':
          description: Plugin inventory list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginInventoryList'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
  /v1/admin/plugins/import:
    post:
      tags: [plugin-governance]
      operationId: importPluginInventoryEntry
      summary: Import a plugin candidate into the platform inventory.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PluginImportRequest'
      responses:
        '202':
          description: Plugin candidate accepted for scan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginInventoryEntry'
        '400':
          $ref: '#/components/responses/PlatformError'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
  /v1/admin/plugins/{plugin_id}/admission:
    post:
      tags: [plugin-governance]
      operationId: decidePluginAdmission
      summary: Approve, disable, or reject a plugin inventory entry.
      parameters:
        - $ref: '#/components/parameters/PluginId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PluginAdmissionDecision'
      responses:
        '200':
          description: Updated plugin inventory entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginInventoryEntry'
        '400':
          $ref: '#/components/responses/PlatformError'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
        '404':
          $ref: '#/components/responses/PlatformError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/TaskId'
    ApprovalId:
      name: approval_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ApprovalId'
    PluginId:
      name: plugin_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/PluginId'
    ChannelConfigId:
      name: channel_config_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ChannelConfigId'
    SkillEvaluationRunId:
      name: run_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SkillEvaluationRunId'
    TenantIdQuery:
      name: tenant_id
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/TenantId'
    StateQuery:
      name: state
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/TaskState'
    LimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    CursorQuery:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
  responses:
    PlatformError:
      description: Platform error response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PlatformError'
  schemas:
    TenantId:
      type: string
      minLength: 1
      pattern: '^tenant_[A-Za-z0-9_-]+$'
    UserId:
      type: string
      minLength: 1
      pattern: '^user_[A-Za-z0-9_-]+$'
    AgentId:
      type: string
      minLength: 1
      pattern: '^agent_[A-Za-z0-9_-]+$'
    TaskId:
      type: string
      minLength: 1
      pattern: '^task_[A-Za-z0-9_-]+$'
    AttemptId:
      type: string
      minLength: 1
      pattern: '^attempt_[A-Za-z0-9_-]+$'
    ExecutionId:
      type: string
      minLength: 1
      pattern: '^exec_[A-Za-z0-9_-]+$'
    ConversationId:
      type: string
      minLength: 1
      pattern: '^conv_[A-Za-z0-9_-]+$'
    ArtifactId:
      type: string
      minLength: 1
      pattern: '^artifact_[A-Za-z0-9_-]+$'
    TraceId:
      type: string
      minLength: 1
      pattern: '^trace_[A-Za-z0-9_-]+$'
    SkillId:
      type: string
      minLength: 1
      pattern: '^skill_[A-Za-z0-9_-]+$'
    SkillEvaluationRunId:
      type: string
      minLength: 1
      pattern: '^skill_eval_run_[A-Za-z0-9_-]+$'
    CapabilityId:
      type: string
      minLength: 1
      pattern: '^cap_[A-Za-z0-9_-]+$'
    ApprovalId:
      type: string
      minLength: 1
      pattern: '^approval_[A-Za-z0-9_-]+$'
    PluginId:
      type: string
      minLength: 1
      pattern: '^plugin_[A-Za-z0-9_-]+$'
    ChannelConfigId:
      type: string
      minLength: 1
      pattern: '^channel_config_[A-Za-z0-9_-]+$'
    ChannelName:
      type: string
      enum:
        - dingtalk
        - feishu
        - telegram
    ChannelConfigStatus:
      type: string
      enum: [enabled, disabled]
    ChannelCredentialStatus:
      type: string
      enum: [reference_configured, missing_reference]
    Timestamp:
      type: string
      format: date-time
      description: UTC timestamp in RFC 3339 format.
    TaskState:
      type: string
      enum:
        - received
        - admitted
        - blocked
        - planning
        - approval_required
        - ready_for_execution
        - executing
        - settling
        - completed
        - failed
        - cancelled
        - archived
    TaskRequest:
      type: object
      additionalProperties: false
      required:
        - tenant_id
        - user_id
        - agent_id
        - conversation_id
        - input
        - trace_id
      properties:
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        user_id:
          $ref: '#/components/schemas/UserId'
        agent_id:
          $ref: '#/components/schemas/AgentId'
        conversation_id:
          $ref: '#/components/schemas/ConversationId'
        input:
          type: string
          minLength: 1
          maxLength: 64000
        skill_id:
          $ref: '#/components/schemas/SkillId'
        capability_ids:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/CapabilityId'
        artifact_ids:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ArtifactId'
        budget:
          $ref: '#/components/schemas/TaskBudget'
        metadata:
          type: object
          additionalProperties:
            type: string
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 128
        trace_id:
          $ref: '#/components/schemas/TraceId'
    TaskBudget:
      type: object
      additionalProperties: false
      properties:
        max_input_tokens:
          type: integer
          minimum: 1
        max_output_tokens:
          type: integer
          minimum: 1
        max_execution_seconds:
          type: integer
          minimum: 1
        max_cost_usd:
          type: number
          minimum: 0
    Task:
      type: object
      additionalProperties: false
      required:
        - tenant_id
        - user_id
        - agent_id
        - task_id
        - attempt_id
        - conversation_id
        - state
        - trace_id
        - created_at
        - updated_at
      properties:
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        user_id:
          $ref: '#/components/schemas/UserId'
        agent_id:
          $ref: '#/components/schemas/AgentId'
        task_id:
          $ref: '#/components/schemas/TaskId'
        attempt_id:
          $ref: '#/components/schemas/AttemptId'
        execution_id:
          $ref: '#/components/schemas/ExecutionId'
        conversation_id:
          $ref: '#/components/schemas/ConversationId'
        state:
          $ref: '#/components/schemas/TaskState'
        summary:
          type: string
        artifact_ids:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactId'
        approval_id:
          $ref: '#/components/schemas/ApprovalId'
        trace_id:
          $ref: '#/components/schemas/TraceId'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    TaskList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        next_cursor:
          type: string
    TaskCancelRequest:
      type: object
      additionalProperties: false
      required: [reason, trace_id]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        trace_id:
          $ref: '#/components/schemas/TraceId'
    TaskRetryRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 1000
        trace_id:
          $ref: '#/components/schemas/TraceId'
    EventEnvelope:
      type: object
      additionalProperties: false
      required:
        - event_id
        - event_type
        - tenant_id
        - task_id
        - trace_id
        - occurred_at
        - payload
      properties:
        event_id:
          type: string
          minLength: 1
        event_type:
          type: string
          enum:
            - task.accepted
            - task.state_changed
            - task.approval_required
            - task.cancellation_requested
            - task.completed
            - task.failed
            - artifact.created
            - memory.accessed
            - approval.decided
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        task_id:
          $ref: '#/components/schemas/TaskId'
        attempt_id:
          $ref: '#/components/schemas/AttemptId'
        execution_id:
          $ref: '#/components/schemas/ExecutionId'
        trace_id:
          $ref: '#/components/schemas/TraceId'
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
        payload:
          type: object
    EventList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EventEnvelope'
        next_cursor:
          type: string
    Skill:
      type: object
      additionalProperties: false
      required: [skill_id, tenant_id, display_name, status, version]
      properties:
        skill_id:
          $ref: '#/components/schemas/SkillId'
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        display_name:
          type: string
          minLength: 1
        description:
          type: string
        status:
          type: string
          enum: [draft, enabled, disabled, archived]
        version:
          type: string
          minLength: 1
        capability_ids:
          type: array
          items:
            $ref: '#/components/schemas/CapabilityId'
    SkillList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Skill'
        next_cursor:
          type: string
    CapabilityDescriptor:
      type: object
      additionalProperties: false
      required:
        - capability_id
        - capability_type
        - display_name
        - status
        - risk_level
      properties:
        capability_id:
          $ref: '#/components/schemas/CapabilityId'
        capability_type:
          type: string
          enum: [channel, message_transform, skill, mcp_server, tool, planner_hint]
        display_name:
          type: string
          minLength: 1
        description:
          type: string
        status:
          type: string
          enum: [approved, enabled, disabled, pending_review, rejected]
        risk_level:
          type: string
          enum: [low, medium, high, critical]
        required_permissions:
          type: array
          items:
            type: string
    CapabilityList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CapabilityDescriptor'
        next_cursor:
          type: string
    SkillEvaluationConfig:
      type: object
      additionalProperties: false
      required: [schema_version, tenant_id, suite_id, enabled, mode, corpus, resource_budget, updated_at_utc, monotonic_ms, trace_id]
      properties:
        schema_version:
          type: string
          const: nexus.skill_evaluation.p7.v1
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        suite_id:
          type: string
          pattern: '^skill_eval_suite_'
        enabled:
          type: boolean
          default: false
        mode:
          type: string
          enum: [manual]
        corpus:
          type: string
          enum: [approved_rejected_disabled]
        resource_budget:
          type: object
          additionalProperties: false
          required: [evaluation_mode, max_cases]
          properties:
            evaluation_mode:
              type: string
              enum: [deterministic_regression]
            max_cases:
              type: integer
              minimum: 1
              maximum: 50
        updated_at_utc:
          $ref: '#/components/schemas/Timestamp'
        monotonic_ms:
          type: integer
          minimum: 0
        trace_id:
          $ref: '#/components/schemas/TraceId'
    SkillEvaluationConfigUpdateRequest:
      type: object
      additionalProperties: false
      required: [tenant_id, trace_id]
      properties:
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        enabled:
          type: boolean
        max_cases:
          type: integer
          minimum: 1
          maximum: 50
        trace_id:
          $ref: '#/components/schemas/TraceId'
    SkillEvaluationRunRequest:
      type: object
      additionalProperties: false
      required: [tenant_id, trace_id]
      properties:
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    SkillEvaluationCaseResult:
      type: object
      additionalProperties: false
      required: [case_id, candidate_id, candidate_kind, expected_outcome, actual_outcome, status, reason_codes]
      properties:
        case_id:
          type: string
          pattern: '^skill_eval_case_'
        candidate_id:
          type: string
          minLength: 1
        candidate_kind:
          type: string
          enum: [capability, plugin_inventory, blocked_fixture]
        capability_type:
          type: string
          enum: [skill, planner_hint]
        expected_outcome:
          type: string
          enum: [visible, blocked, skipped]
        actual_outcome:
          type: string
          enum: [visible, blocked, skipped]
        status:
          type: string
          enum: [passed, failed, skipped]
        reason_codes:
          type: array
          items:
            type: string
            pattern: '^SKILL_EVAL'
    SkillEvaluationRunReport:
      type: object
      additionalProperties: false
      required: [schema_version, tenant_id, run_id, suite_id, status, totals, cases, resource_budget, started_at_utc, completed_at_utc, monotonic_ms, trace_id, reason_codes]
      properties:
        schema_version:
          type: string
          const: nexus.skill_evaluation.p7.v1
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        run_id:
          $ref: '#/components/schemas/SkillEvaluationRunId'
        suite_id:
          type: string
          pattern: '^skill_eval_suite_'
        status:
          type: string
          enum: [passed, failed, skipped]
        totals:
          type: object
          additionalProperties: false
          required: [total_cases, passed_cases, failed_cases, skipped_cases, approved_cases, rejected_disabled_cases]
          properties:
            total_cases:
              type: integer
              minimum: 0
            passed_cases:
              type: integer
              minimum: 0
            failed_cases:
              type: integer
              minimum: 0
            skipped_cases:
              type: integer
              minimum: 0
            approved_cases:
              type: integer
              minimum: 0
            rejected_disabled_cases:
              type: integer
              minimum: 0
        cases:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/SkillEvaluationCaseResult'
        resource_budget:
          type: object
          additionalProperties: false
          required: [evaluation_mode, max_cases, evaluated_cases]
          properties:
            evaluation_mode:
              type: string
              enum: [deterministic_regression]
            max_cases:
              type: integer
              minimum: 1
              maximum: 50
            evaluated_cases:
              type: integer
              minimum: 0
        started_at_utc:
          $ref: '#/components/schemas/Timestamp'
        completed_at_utc:
          $ref: '#/components/schemas/Timestamp'
        monotonic_ms:
          type: integer
          minimum: 0
        trace_id:
          $ref: '#/components/schemas/TraceId'
        reason_codes:
          type: array
          items:
            type: string
            pattern: '^SKILL_EVALUATION_'
    SkillEvaluationRunList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SkillEvaluationRunReport'
        next_cursor:
          type: string
    MemorySearchRequest:
      type: object
      additionalProperties: false
      required: [tenant_id, query, trace_id]
      properties:
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        user_id:
          $ref: '#/components/schemas/UserId'
        agent_id:
          $ref: '#/components/schemas/AgentId'
        conversation_id:
          $ref: '#/components/schemas/ConversationId'
        query:
          type: string
          minLength: 1
          maxLength: 4000
        layer:
          $ref: '#/components/schemas/MemoryLayer'
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        trace_id:
          $ref: '#/components/schemas/TraceId'
    MemorySearchResult:
      type: object
      additionalProperties: false
      required: [memory_id, tenant_id, layer, text, score, trace_id]
      properties:
        memory_id:
          type: string
          minLength: 1
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        layer:
          $ref: '#/components/schemas/MemoryLayer'
        text:
          type: string
        score:
          type: number
          minimum: 0
          maximum: 1
        trace_id:
          $ref: '#/components/schemas/TraceId'
    MemorySearchResultList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MemorySearchResult'
    MemoryLayer:
      type: string
      enum: [session, user, agent_skill, organization, audit_snapshot]
    MemoryWriteRequest:
      type: object
      additionalProperties: false
      required: [tenant_id, layer, text, trace_id]
      properties:
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        user_id:
          $ref: '#/components/schemas/UserId'
        agent_id:
          $ref: '#/components/schemas/AgentId'
        conversation_id:
          $ref: '#/components/schemas/ConversationId'
        layer:
          $ref: '#/components/schemas/MemoryLayer'
        text:
          type: string
          minLength: 1
          maxLength: 64000
        trace_id:
          $ref: '#/components/schemas/TraceId'
    MemoryRecord:
      type: object
      additionalProperties: false
      required: [memory_id, tenant_id, layer, text, version, trace_id]
      properties:
        memory_id:
          type: string
          minLength: 1
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        layer:
          $ref: '#/components/schemas/MemoryLayer'
        text:
          type: string
        version:
          type: integer
          minimum: 1
        trace_id:
          $ref: '#/components/schemas/TraceId'
    MemoryRetentionRule:
      type: object
      additionalProperties: false
      required: [layer, enabled, ttl_days, action, immutable]
      properties:
        layer:
          $ref: '#/components/schemas/MemoryLayer'
        enabled:
          type: boolean
        ttl_days:
          type: integer
          nullable: true
          minimum: 1
          maximum: 3650
        action:
          type: string
          enum: [retain, soft_delete]
        immutable:
          type: boolean
    MemoryRetentionPolicy:
      type: object
      additionalProperties: false
      required: [schema_version, tenant_id, policy_id, enabled, mode, rules, resource_budget, updated_at_utc, monotonic_ms, trace_id]
      properties:
        schema_version:
          type: string
          enum: [nexus.memory_retention.p7.v1]
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        policy_id:
          type: string
          pattern: '^memory_retention_'
        enabled:
          type: boolean
        mode:
          type: string
          enum: [conservative]
        rules:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/MemoryRetentionRule'
        resource_budget:
          type: object
          additionalProperties: false
          required: [evaluation_mode, max_sweep_records, max_policy_rules]
          properties:
            evaluation_mode:
              type: string
              enum: [manual_sweep]
            max_sweep_records:
              type: integer
              minimum: 1
              maximum: 1000
            max_policy_rules:
              type: integer
              minimum: 1
              maximum: 5
        updated_at_utc:
          $ref: '#/components/schemas/Timestamp'
        monotonic_ms:
          type: integer
          minimum: 0
        trace_id:
          $ref: '#/components/schemas/TraceId'
    MemoryRetentionPolicyUpdateRequest:
      type: object
      additionalProperties: false
      required: [tenant_id, trace_id]
      properties:
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        enabled:
          type: boolean
        rules:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/MemoryRetentionRule'
        max_sweep_records:
          type: integer
          minimum: 1
          maximum: 1000
        trace_id:
          $ref: '#/components/schemas/TraceId'
    MemoryRetentionSweepRequest:
      type: object
      additionalProperties: false
      required: [tenant_id, trace_id]
      properties:
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        max_records:
          type: integer
          minimum: 1
          maximum: 1000
        trace_id:
          $ref: '#/components/schemas/TraceId'
    MemoryDeleteRequest:
      type: object
      additionalProperties: false
      required: [tenant_id, reason, trace_id]
      properties:
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        trace_id:
          $ref: '#/components/schemas/TraceId'
    MemoryDeleteResult:
      type: object
      additionalProperties: false
      required: [schema_version, tenant_id, memory_id, layer, status, reason_code, version, deleted_at_utc, monotonic_ms, trace_id]
      properties:
        schema_version:
          type: string
          enum: [nexus.memory_retention.p7.v1]
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        memory_id:
          type: string
          pattern: '^memory_'
        layer:
          $ref: '#/components/schemas/MemoryLayer'
        status:
          type: string
          enum: [deleted, expired]
        reason_code:
          type: string
          enum: [MEMORY_MANUAL_DELETE, MEMORY_RETENTION_EXPIRED]
        version:
          type: integer
          minimum: 1
        deleted_at_utc:
          $ref: '#/components/schemas/Timestamp'
        monotonic_ms:
          type: integer
          minimum: 0
        trace_id:
          $ref: '#/components/schemas/TraceId'
    MemoryRetentionSweepResult:
      type: object
      additionalProperties: false
      required: [schema_version, tenant_id, policy_id, scanned_count, deleted_count, skipped_count, items, resource_budget, swept_at_utc, monotonic_ms, trace_id]
      properties:
        schema_version:
          type: string
          enum: [nexus.memory_retention.p7.v1]
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        policy_id:
          type: string
          pattern: '^memory_retention_'
        scanned_count:
          type: integer
          minimum: 0
        deleted_count:
          type: integer
          minimum: 0
        skipped_count:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: '#/components/schemas/MemoryDeleteResult'
        resource_budget:
          type: object
          additionalProperties: false
          required: [evaluation_mode, max_sweep_records, evaluated_records]
          properties:
            evaluation_mode:
              type: string
              enum: [manual_sweep]
            max_sweep_records:
              type: integer
              minimum: 1
            evaluated_records:
              type: integer
              minimum: 0
        swept_at_utc:
          $ref: '#/components/schemas/Timestamp'
        monotonic_ms:
          type: integer
          minimum: 0
        trace_id:
          $ref: '#/components/schemas/TraceId'
    Tenant:
      type: object
      additionalProperties: false
      required: [tenant_id, name, status, created_at]
      properties:
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        name:
          type: string
          minLength: 1
        status:
          type: string
          enum: [active, suspended, archived]
        created_at:
          $ref: '#/components/schemas/Timestamp'
    TenantList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Tenant'
        next_cursor:
          type: string
    TenantUser:
      type: object
      additionalProperties: false
      required: [tenant_id, user_id, roles, status]
      properties:
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        user_id:
          $ref: '#/components/schemas/UserId'
        roles:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [active, disabled]
    TenantUserList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
