          type: string
          enum: [marketplace, package_registry, git_repository, local_snapshot, mcp_manifest]
        version:
          type: string
          minLength: 1
        sha256:
          type: string
          minLength: 64
          maxLength: 64
        license:
          type: string
          minLength: 1
        notice_status:
          type: string
          enum: [recorded, pending_review]
        risk_level:
          type: string
          enum: [low, medium, high, critical]
        allowlist_status:
          type: string
          enum: [pending_scan, pending_review, approved, disabled, rejected]
