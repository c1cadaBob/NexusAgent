      required: [schema_version, tenant_id, policy_id, enabled, dimension_mode, enforcement_scope, limits, resource_budget, updated_at_utc, monotonic_ms, trace_id]
      properties:
        schema_version:
          type: string
          enum: [nexus.token_budget.p7.v1]
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        policy_id:
          type: string
          pattern: '^budget_policy_'
        enabled:
          type: boolean
          default: true
        dimension_mode:
          type: string
          enum: [all_configured]
        enforcement_scope:
          type: string
          enum: [task_adapter_api]
        limits:
          $ref: '#/components/schemas/TokenBudgetLimits'
        resource_budget:
          type: object
          additionalProperties: false
          required: [accounting_mode, dimensions]
          properties:
            accounting_mode:
              type: string
              enum: [deterministic_estimate]
            dimensions:
              type: array
              items:
                type: string
                enum: [tenant, user, agent, task]
        updated_at_utc:
          $ref: '#/components/schemas/Timestamp'
        monotonic_ms:
          type: integer
          minimum: 0
        trace_id:
          $ref: '#/components/schemas/TraceId'
    TokenBudgetPolicyUpdateRequest:
      type: object
      additionalProperties: false
      required: [tenant_id, trace_id]
      properties:
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        enabled:
          type: boolean
        limits:
          $ref: '#/components/schemas/TokenBudgetLimits'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    TokenBudgetDimensionStatus:
      type: object
      additionalProperties: false
      required: [dimension, key, limit_units, consumed_units, remaining_units, status]
      properties:
        dimension:
          type: string
          enum: [tenant, user, agent, task]
        key:
          type: string
          minLength: 1
        limit_units:
          type: integer
          minimum: 1
        consumed_units:
          type: integer
          minimum: 0
        remaining_units:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [approved, degraded]
    BudgetCheckRequest:
      type: object
      additionalProperties: false
      required: [tenant_id, trace_id]
      properties:
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        user_id:
          $ref: '#/components/schemas/UserId'
        agent_id:
          $ref: '#/components/schemas/AgentId'
        task_id:
          $ref: '#/components/schemas/TaskId'
        attempt_id:
          $ref: '#/components/schemas/AttemptId'
        execution_id:
          $ref: '#/components/schemas/ExecutionId'
        conversation_id:
          $ref: '#/components/schemas/ConversationId'
        requested_units:
          type: integer
          minimum: 1
        input:
          type: string
          minLength: 1
          description: Optional text used for deterministic budget estimation when requested_units is omitted.
        consume:
          type: boolean
          default: false
        remaining_units:
          type: integer
          minimum: 0
          deprecated: true
        max_units_per_attempt:
          type: integer
          minimum: 1
          deprecated: true
        trace_id:
          $ref: '#/components/schemas/TraceId'
    BudgetCheckResult:
      type: object
      additionalProperties: false
      required: [schema_version, tenant_id, trace_id, policy_id, decision_id, status, requested_units, remaining_units, max_units_per_attempt, dimensions, reason_codes, checked_at_utc, monotonic_ms]
      properties:
        schema_version:
          type: string
          enum: [nexus.token_budget.p7.v1]
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        user_id:
          $ref: '#/components/schemas/UserId'
        agent_id:
          $ref: '#/components/schemas/AgentId'
        task_id:
          $ref: '#/components/schemas/TaskId'
        attempt_id:
          $ref: '#/components/schemas/AttemptId'
        execution_id:
          $ref: '#/components/schemas/ExecutionId'
        conversation_id:
          $ref: '#/components/schemas/ConversationId'
        trace_id:
          $ref: '#/components/schemas/TraceId'
        policy_id:
          type: string
          pattern: '^budget_policy_'
        decision_id:
          type: string
          pattern: '^decision_'
        status:
          type: string
          enum: [approved, degraded, denied]
        code:
          type: string
          enum: [PLATFORM_RATE_LIMITED, PLATFORM_POLICY_DENIED]
        reasons:
          type: array
          items:
            type: string
        requested_units:
          type: integer
          minimum: 1
        remaining_units:
          type: integer
          minimum: 0
        max_units_per_attempt:
          type: integer
          minimum: 1
        dimensions:
          type: array
          items:
            $ref: '#/components/schemas/TokenBudgetDimensionStatus'
        reason_codes:
          type: array
          items:
            type: string
            enum: [TOKEN_BUDGET_APPROVED, TOKEN_BUDGET_DISABLED, TOKEN_BUDGET_EXCEEDED, TOKEN_BUDGET_MAX_ATTEMPT_EXCEEDED]
        checked_at_utc:
          $ref: '#/components/schemas/Timestamp'
        monotonic_ms:
          type: integer
          minimum: 0
    TokenBudgetLedgerEntry:
      allOf:
        - $ref: '#/components/schemas/BudgetCheckResult'
        - type: object
          additionalProperties: false
          required: [ledger_id, status, consumed_units, recorded_at_utc]
          properties:
            ledger_id:
              type: string
              pattern: '^ledger_'
            status:
              type: string
              enum: [checked, reserved, denied]
            consumed_units:
              type: integer
              minimum: 0
            recorded_at_utc:
              $ref: '#/components/schemas/Timestamp'
    TokenBudgetLedgerList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TokenBudgetLedgerEntry'
        next_cursor:
          type: string
