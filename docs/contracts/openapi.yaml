          type: array
          items:
            $ref: '#/components/schemas/CapabilityId'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    PluginInventoryList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PluginInventoryEntry'
        next_cursor:
          type: string
    PluginImportRequest:
      type: object
      additionalProperties: false
      required: [source_kind, source_ref, display_name, version, expected_sha256, license, notice_status, trace_id]
      properties:
        source_kind:
          type: string
          enum: [marketplace, package_registry, git_repository, local_snapshot, mcp_manifest]
        source_ref:
          type: string
          minLength: 1
          description: Platform-side import reference visible only to administrators.
        display_name:
          type: string
          minLength: 1
        version:
          type: string
          minLength: 1
        expected_sha256:
          type: string
          minLength: 64
          maxLength: 64
          pattern: '^[A-Fa-f0-9]{64}$'
        license:
          type: string
          minLength: 1
        notice_status:
          type: string
          enum: [recorded, pending_review]
        risk_level:
          type: string
          enum: [low, medium, high, critical]
        trace_id:
          $ref: '#/components/schemas/TraceId'
    PluginAdmissionDecision:
      type: object
      additionalProperties: false
      required: [decision, reason, trace_id]
      properties:
        decision:
          type: string
          enum: [approve, disable, reject]
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        tenant_scope:
          type: array
          items:
            $ref: '#/components/schemas/TenantId'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status, checked_at, service, trace_id]
      properties:
        status:
          type: string
          enum: [ok, degraded, unavailable]
        checked_at:
          $ref: '#/components/schemas/Timestamp'
        service:
          type: string
          const: nexusagent-platform-api
        trace_id:
          $ref: '#/components/schemas/TraceId'
        dependencies:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, status]
            properties:
              name:
                type: string
                enum:
                  - coordinator
                  - policy_gate
                  - event_bus
                  - task_state
                  - memory_gateway
                  - artifact_store
                  - credential_center
                  - tenancy
                  - rbac
                  - audit
                  - observability
              status:
                type: string
                enum: [ok, degraded, unavailable]
