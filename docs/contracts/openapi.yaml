      type: object
      additionalProperties: false
      required: [code, message, trace_id]
      properties:
        code:
          $ref: '#/components/schemas/PlatformErrorCode'
        message:
          type: string
          minLength: 1
        trace_id:
          $ref: '#/components/schemas/TraceId'
        details:
          type: object
          additionalProperties: true
