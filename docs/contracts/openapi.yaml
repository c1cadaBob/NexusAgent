openapi: 3.1.0
info:
  title: NexusAgent Platform API
  version: 0.5.0-p5
  summary: Unified public REST API for NexusAgent platform resources.
  description: >-
    P5 REST MVP of the public NexusAgent API. The contract exposes only platform
    resources: tasks, attempts, executions, skills, capabilities, memory,
    skill evaluations, tenants, approvals, channel management, plugin governance, artifacts, audit references, and
    health. Internal implementation details, internal component brands, raw
    endpoint references, internal error identifiers, and internal storage
    locations are intentionally excluded. P5-04 TypeScript SDK and developer
    docs consume this contract as the only public API source. P5 Alpha event
    reads use /v1/tasks/{task_id}/events; webhook delivery and streaming
    transports are deferred.
  license:
    name: Internal planning draft
    identifier: LicenseRef-NexusAgent-Planning-Draft
servers:
  - url: https://api.nexusagent.local
    description: Platform API base URL placeholder for deployment-specific routing
security:
  - bearerAuth: []
tags:
  - name: health
    description: Platform liveness and readiness checks.
  - name: tasks
    description: Task submission, state, cancellation, retry, and event reads.
  - name: scheduled-goals
    description: Default-off scheduled goal tasks using UTC cron-like recurrence and manual due scans.
  - name: skills
    description: Platform skill catalog operations.
  - name: capabilities
    description: Approved platform capabilities available to callers.
  - name: skill-evaluations
    description: Administrator-triggered deterministic skill regression checks.
  - name: memory
    description: Memory access through the platform memory gateway.
  - name: tenants
    description: Tenant administration and visibility.
  - name: permissions
    description: Platform permission catalog.
  - name: approvals
    description: Human or policy approval workflow.
  - name: budget
    description: Platform budget admission checks.
  - name: channels
    description: Tenant channel configuration and connection dry-run checks.
  - name: plugin-governance
    description: Administrator-only plugin inventory and admission workflow.
paths:
  /v1/health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Read platform health.
      security: []
      responses:
        '200':
          description: Platform is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '429':
          $ref: '#/components/responses/PlatformError'
        '503':
          $ref: '#/components/responses/PlatformError'
  /v1/tasks:
    post:
      tags: [tasks]
      operationId: createTask
      summary: Submit a platform task.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskRequest'
      responses:
        '202':
          description: Task accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/PlatformError'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
        '409':
          $ref: '#/components/responses/PlatformError'
    get:
      tags: [tasks]
      operationId: listTasks
      summary: List tasks visible to the caller.
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
        - $ref: '#/components/parameters/StateQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CursorQuery'
      responses:
        '200':
          description: Task list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskList'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
  /v1/tasks/{task_id}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [tasks]
      operationId: getTask
      summary: Read a task and its current platform state.
      responses:
        '200':
          description: Task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
        '404':
          $ref: '#/components/responses/PlatformError'
  /v1/tasks/{task_id}/cancel:
    post:
      tags: [tasks]
      operationId: cancelTask
      summary: Request cancellation of the active task attempt.
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCancelRequest'
      responses:
        '202':
          description: Cancellation accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/PlatformError'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
        '404':
          $ref: '#/components/responses/PlatformError'
        '409':
          $ref: '#/components/responses/PlatformError'
  /v1/tasks/{task_id}/retry:
    post:
      tags: [tasks]
      operationId: retryTask
      summary: Start a new attempt for a retryable task.
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskRetryRequest'
      responses:
        '202':
          description: Retry accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
        '404':
          $ref: '#/components/responses/PlatformError'
        '409':
          $ref: '#/components/responses/PlatformError'
  /v1/tasks/{task_id}/events:
    get:
      tags: [tasks]
      operationId: listTaskEvents
      summary: List platform events for one task.
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CursorQuery'
      responses:
        '200':
          description: Task event list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventList'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
        '404':
          $ref: '#/components/responses/PlatformError'
  /v1/scheduled-goals/config:
    get:
      tags: [scheduled-goals]
      operationId: getScheduledGoalsConfig
      summary: Read scheduled goal configuration.
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
        - name: trace_id
          in: query
          schema:
            $ref: '#/components/schemas/TraceId'
      responses:
        '200':
          description: Scheduled goal configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledGoalsConfig'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
    patch:
      tags: [scheduled-goals]
      operationId: updateScheduledGoalsConfig
      summary: Enable or disable scheduled goal manual ticks for one tenant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduledGoalsConfigUpdateRequest'
      responses:
        '200':
          description: Updated scheduled goal configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledGoalsConfig'
        '400':
          $ref: '#/components/responses/PlatformError'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
  /v1/scheduled-goals:
    get:
      tags: [scheduled-goals]
      operationId: listScheduledGoals
      summary: List scheduled goals visible to the caller.
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
        - name: user_id
          in: query
          schema:
            $ref: '#/components/schemas/UserId'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ScheduledGoalStatus'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CursorQuery'
      responses:
        '200':
          description: Scheduled goal list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledGoalList'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
    post:
      tags: [scheduled-goals]
      operationId: createScheduledGoal
      summary: Create a scheduled goal without executing it immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduledGoalCreateRequest'
      responses:
        '201':
          description: Scheduled goal created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledGoal'
        '400':
          $ref: '#/components/responses/PlatformError'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
        '409':
          $ref: '#/components/responses/PlatformError'
        '429':
          $ref: '#/components/responses/PlatformError'
  /v1/scheduled-goals/{scheduled_goal_id}:
    parameters:
      - $ref: '#/components/parameters/ScheduledGoalId'
    get:
      tags: [scheduled-goals]
      operationId: getScheduledGoal
      summary: Read one scheduled goal.
      responses:
        '200':
          description: Scheduled goal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledGoal'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
        '404':
          $ref: '#/components/responses/PlatformError'
    patch:
      tags: [scheduled-goals]
      operationId: updateScheduledGoal
      summary: Update cron, task fields, budget units, or pause/resume status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduledGoalUpdateRequest'
      responses:
        '200':
          description: Updated scheduled goal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledGoal'
        '400':
          $ref: '#/components/responses/PlatformError'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
        '404':
          $ref: '#/components/responses/PlatformError'
        '409':
          $ref: '#/components/responses/PlatformError'
  /v1/scheduled-goals/{scheduled_goal_id}/cancel:
    post:
      tags: [scheduled-goals]
      operationId: cancelScheduledGoal
      summary: Cancel a scheduled goal and its latest active platform task when present.
      parameters:
        - $ref: '#/components/parameters/ScheduledGoalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduledGoalActionRequest'
      responses:
        '202':
          description: Scheduled goal cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledGoal'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
        '404':
          $ref: '#/components/responses/PlatformError'
  /v1/scheduled-goals/{scheduled_goal_id}/retry:
    post:
      tags: [scheduled-goals]
      operationId: retryScheduledGoal
      summary: Requeue a cancelled, failed, or completed scheduled goal.
      parameters:
        - $ref: '#/components/parameters/ScheduledGoalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduledGoalActionRequest'
      responses:
        '202':
          description: Scheduled goal retried.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledGoal'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
        '404':
          $ref: '#/components/responses/PlatformError'
        '409':
          $ref: '#/components/responses/PlatformError'
  /v1/scheduled-goals/run-due:
    post:
      tags: [scheduled-goals]
      operationId: runDueScheduledGoals
      summary: Manually scan due scheduled goals and submit platform tasks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduledGoalRunDueRequest'
      responses:
        '202':
          description: Due scan completed or skipped.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledGoalRunDueResult'
        '400':
          $ref: '#/components/responses/PlatformError'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
        '429':
          $ref: '#/components/responses/PlatformError'
  /v1/skills:
    get:
      tags: [skills]
      operationId: listSkills
      summary: List platform skills.
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CursorQuery'
      responses:
        '200':
          description: Skill list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillList'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
  /v1/capabilities:
    get:
      tags: [capabilities]
      operationId: listCapabilities
      summary: List approved platform capabilities visible to the caller.
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CursorQuery'
      responses:
        '200':
          description: Capability list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityList'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
  /v1/skill-evaluations/config:
    get:
      tags: [skill-evaluations]
      operationId: getSkillEvaluationConfig
      summary: Read tenant skill evaluation configuration.
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
        - name: trace_id
          in: query
          schema:
            $ref: '#/components/schemas/TraceId'
      responses:
        '200':
          description: Skill evaluation configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillEvaluationConfig'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
    patch:
      tags: [skill-evaluations]
      operationId: updateSkillEvaluationConfig
      summary: Enable or disable manual skill evaluation for one tenant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillEvaluationConfigUpdateRequest'
      responses:
        '200':
          description: Updated skill evaluation configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillEvaluationConfig'
        '400':
          $ref: '#/components/responses/PlatformError'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
  /v1/skill-evaluations/runs:
    post:
      tags: [skill-evaluations]
      operationId: runSkillEvaluation
      summary: Run deterministic skill evaluation manually.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillEvaluationRunRequest'
      responses:
        '202':
          description: Skill evaluation run completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillEvaluationRunReport'
        '400':
          $ref: '#/components/responses/PlatformError'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
    get:
      tags: [skill-evaluations]
      operationId: listSkillEvaluationRuns
      summary: List skill evaluation runs visible to the administrator.
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CursorQuery'
      responses:
        '200':
          description: Skill evaluation run list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillEvaluationRunList'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
  /v1/skill-evaluations/runs/{run_id}:
    get:
      tags: [skill-evaluations]
      operationId: getSkillEvaluationRun
      summary: Read one skill evaluation report.
      parameters:
        - $ref: '#/components/parameters/SkillEvaluationRunId'
        - $ref: '#/components/parameters/TenantIdQuery'
      responses:
        '200':
          description: Skill evaluation run report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillEvaluationRunReport'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
        '404':
          $ref: '#/components/responses/PlatformError'
  /v1/memory/search:
    post:
      tags: [memory]
      operationId: searchMemory
      summary: Search memory through the platform gateway.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemorySearchRequest'
      responses:
        '200':
          description: Memory search results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemorySearchResultList'
        '400':
          $ref: '#/components/responses/PlatformError'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
  /v1/memory:
    post:
      tags: [memory]
      operationId: writeMemory
      summary: Write memory through the platform gateway.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryWriteRequest'
      responses:
        '201':
          description: Memory record written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryRecord'
        '400':
          $ref: '#/components/responses/PlatformError'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
  /v1/memory/retention:
    get:
      tags: [memory]
      operationId: getMemoryRetentionPolicy
      summary: Read tenant memory retention policy.
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
        - name: trace_id
          in: query
          schema:
            $ref: '#/components/schemas/TraceId'
      responses:
        '200':
          description: Memory retention policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryRetentionPolicy'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
    patch:
      tags: [memory]
      operationId: updateMemoryRetentionPolicy
      summary: Update tenant memory retention policy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryRetentionPolicyUpdateRequest'
      responses:
        '200':
          description: Updated memory retention policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryRetentionPolicy'
        '400':
          $ref: '#/components/responses/PlatformError'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
  /v1/memory/retention/sweep:
    post:
      tags: [memory]
      operationId: sweepMemoryRetention
      summary: Run a manual memory retention sweep.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryRetentionSweepRequest'
      responses:
        '200':
          description: Memory retention sweep result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryRetentionSweepResult'
        '400':
          $ref: '#/components/responses/PlatformError'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
  /v1/memory/conflicts:
    get:
      tags: [memory]
      operationId: listMemoryConflicts
      summary: List metadata-only memory conflicts awaiting administrator review.
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, resolved, ignored]
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CursorQuery'
      responses:
        '200':
          description: Memory conflict list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryConflictList'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
  /v1/memory/conflicts/{conflict_id}:
    get:
      tags: [memory]
      operationId: getMemoryConflict
      summary: Read one metadata-only memory conflict.
      parameters:
        - $ref: '#/components/parameters/MemoryConflictId'
        - $ref: '#/components/parameters/TenantIdQuery'
      responses:
        '200':
          description: Memory conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryConflict'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
        '404':
          $ref: '#/components/responses/PlatformError'
  /v1/memory/conflicts/{conflict_id}/decision:
    post:
      tags: [memory]
      operationId: decideMemoryConflict
      summary: Resolve or ignore a metadata-only memory conflict.
      parameters:
        - $ref: '#/components/parameters/MemoryConflictId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryConflictDecisionRequest'
      responses:
        '200':
          description: Updated memory conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryConflict'
        '400':
          $ref: '#/components/responses/PlatformError'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
        '404':
          $ref: '#/components/responses/PlatformError'
        '409':
          $ref: '#/components/responses/PlatformError'
  /v1/memory/{memory_id}/delete:
    post:
      tags: [memory]
      operationId: deleteMemory
      summary: Soft delete a memory record through the platform gateway.
      parameters:
        - name: memory_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^memory_'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryDeleteRequest'
      responses:
        '200':
          description: Memory delete result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryDeleteResult'
        '400':
          $ref: '#/components/responses/PlatformError'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
        '404':
          $ref: '#/components/responses/PlatformError'
  /v1/tenants:
    get:
      tags: [tenants]
      operationId: listTenants
      summary: List tenants visible to an administrator.
      parameters:
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CursorQuery'
      responses:
        '200':
          description: Tenant list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantList'
        '401':
          $ref: '#/components/responses/PlatformError'
        '403':
          $ref: '#/components/responses/PlatformError'
  /v1/tenants/{tenant_id}/users:
    get:
      tags: [tenants]
      operationId: listTenantUsers
      summary: List users for one tenant.
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/TenantId'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CursorQuery'
      responses:
