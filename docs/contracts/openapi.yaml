        '403':
          $ref: '#/components/responses/PlatformError'
        '404':
          $ref: '#/components/responses/PlatformError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/TaskId'
    ApprovalId:
      name: approval_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ApprovalId'
    PluginId:
      name: plugin_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/PluginId'
    ChannelConfigId:
      name: channel_config_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ChannelConfigId'
    SkillEvaluationRunId:
      name: run_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SkillEvaluationRunId'
    ScheduledGoalId:
      name: scheduled_goal_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ScheduledGoalId'
    MemoryConflictId:
      name: conflict_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/MemoryConflictId'
    TenantIdQuery:
      name: tenant_id
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/TenantId'
    StateQuery:
      name: state
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/TaskState'
    LimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    CursorQuery:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
  responses:
    PlatformError:
      description: Platform error response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PlatformError'
  schemas:
    TenantId:
      type: string
      minLength: 1
      pattern: '^tenant_[A-Za-z0-9_-]+$'
    UserId:
      type: string
      minLength: 1
      pattern: '^user_[A-Za-z0-9_-]+$'
    AgentId:
      type: string
      minLength: 1
      pattern: '^agent_[A-Za-z0-9_-]+$'
    TaskId:
      type: string
      minLength: 1
      pattern: '^task_[A-Za-z0-9_-]+$'
    AttemptId:
      type: string
      minLength: 1
      pattern: '^attempt_[A-Za-z0-9_-]+$'
    ExecutionId:
      type: string
      minLength: 1
      pattern: '^exec_[A-Za-z0-9_-]+$'
    ConversationId:
      type: string
      minLength: 1
      pattern: '^conv_[A-Za-z0-9_-]+$'
    ArtifactId:
      type: string
      minLength: 1
      pattern: '^artifact_[A-Za-z0-9_-]+$'
    TraceId:
      type: string
      minLength: 1
      pattern: '^trace_[A-Za-z0-9_-]+$'
    SkillId:
      type: string
      minLength: 1
      pattern: '^skill_[A-Za-z0-9_-]+$'
    SkillEvaluationRunId:
      type: string
      minLength: 1
      pattern: '^skill_eval_run_[A-Za-z0-9_-]+$'
    ScheduledGoalId:
      type: string
      minLength: 1
      pattern: '^scheduled_goal_[A-Za-z0-9_-]+$'
    ScheduledGoalStatus:
      type: string
      enum: [scheduled, running, completed, cancelled, failed, paused, blocked]
    ScheduledGoalRunStatus:
      type: string
      enum: [submitted, blocked, failed, skipped]
    MemoryConflictId:
      type: string
      minLength: 1
      pattern: '^conflict_[A-Za-z0-9_-]+$'
    CapabilityId:
      type: string
      minLength: 1
      pattern: '^cap_[A-Za-z0-9_-]+$'
    ApprovalId:
      type: string
      minLength: 1
      pattern: '^approval_[A-Za-z0-9_-]+$'
    PluginId:
      type: string
      minLength: 1
      pattern: '^plugin_[A-Za-z0-9_-]+$'
    ChannelConfigId:
      type: string
      minLength: 1
      pattern: '^channel_config_[A-Za-z0-9_-]+$'
    ChannelName:
      type: string
      enum:
        - dingtalk
        - feishu
        - telegram
    ChannelConfigStatus:
      type: string
      enum: [enabled, disabled]
    ChannelCredentialStatus:
      type: string
      enum: [reference_configured, missing_reference]
    Timestamp:
      type: string
      format: date-time
      description: UTC timestamp in RFC 3339 format.
    TaskState:
      type: string
      enum:
        - received
        - admitted
        - blocked
        - planning
        - approval_required
        - ready_for_execution
        - executing
        - settling
        - completed
        - failed
        - cancelled
        - archived
    TaskRequest:
      type: object
      additionalProperties: false
      required:
        - tenant_id
        - user_id
        - agent_id
        - conversation_id
        - input
        - trace_id
      properties:
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        user_id:
          $ref: '#/components/schemas/UserId'
        agent_id:
          $ref: '#/components/schemas/AgentId'
        conversation_id:
          $ref: '#/components/schemas/ConversationId'
        input:
          type: string
          minLength: 1
          maxLength: 64000
        skill_id:
          $ref: '#/components/schemas/SkillId'
        capability_ids:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/CapabilityId'
        artifact_ids:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ArtifactId'
        budget:
          $ref: '#/components/schemas/TaskBudget'
        budget_units:
          type: integer
          minimum: 1
          description: Optional P7-04 deterministic token budget units; omitted requests use platform estimation.
        metadata:
          type: object
          additionalProperties:
            type: string
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 128
        trace_id:
          $ref: '#/components/schemas/TraceId'
    TaskBudget:
      type: object
      additionalProperties: false
      properties:
        max_input_tokens:
          type: integer
          minimum: 1
        max_output_tokens:
          type: integer
          minimum: 1
        max_execution_seconds:
          type: integer
          minimum: 1
        max_cost_usd:
          type: number
          minimum: 0
    Task:
      type: object
      additionalProperties: false
      required:
        - tenant_id
        - user_id
        - agent_id
        - task_id
        - attempt_id
        - conversation_id
        - state
        - trace_id
        - created_at
        - updated_at
      properties:
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        user_id:
          $ref: '#/components/schemas/UserId'
        agent_id:
          $ref: '#/components/schemas/AgentId'
        task_id:
          $ref: '#/components/schemas/TaskId'
        attempt_id:
          $ref: '#/components/schemas/AttemptId'
        execution_id:
          $ref: '#/components/schemas/ExecutionId'
        conversation_id:
          $ref: '#/components/schemas/ConversationId'
        state:
          $ref: '#/components/schemas/TaskState'
        summary:
          type: string
        artifact_ids:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactId'
        approval_id:
          $ref: '#/components/schemas/ApprovalId'
        trace_id:
          $ref: '#/components/schemas/TraceId'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    TaskList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        next_cursor:
          type: string
    TaskCancelRequest:
      type: object
      additionalProperties: false
      required: [reason, trace_id]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        trace_id:
          $ref: '#/components/schemas/TraceId'
    TaskRetryRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 1000
        trace_id:
          $ref: '#/components/schemas/TraceId'
    ScheduledGoalsConfig:
      type: object
      additionalProperties: false
      required: [schema_version, tenant_id, enabled, schedule_mode, execution_mode, resource_budget, updated_at_utc, monotonic_ms, trace_id]
      properties:
        schema_version:
          const: nexus.scheduled_goal.p7.v1
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        enabled:
          type: boolean
          default: false
        schedule_mode:
          const: cron_like_utc
        execution_mode:
          const: manual_tick
        resource_budget:
          type: object
          additionalProperties: false
          required: [budget_mode, max_active_goals, max_due_per_tick, min_interval_minutes]
          properties:
            budget_mode:
              const: alpha_in_memory_limits
            max_active_goals:
              type: integer
              minimum: 1
              maximum: 500
              default: 100
            max_due_per_tick:
              type: integer
              minimum: 1
              maximum: 100
              default: 25
            min_interval_minutes:
              type: integer
              minimum: 1
              maximum: 1440
              default: 5
        updated_at_utc:
          $ref: '#/components/schemas/Timestamp'
        monotonic_ms:
          type: integer
          minimum: 0
        trace_id:
          $ref: '#/components/schemas/TraceId'
    ScheduledGoalsConfigUpdateRequest:
      type: object
      additionalProperties: false
      required: [tenant_id, trace_id]
      properties:
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        enabled:
          type: boolean
        max_active_goals:
          type: integer
          minimum: 1
          maximum: 500
        max_due_per_tick:
          type: integer
          minimum: 1
          maximum: 100
        min_interval_minutes:
          type: integer
          minimum: 1
          maximum: 1440
        trace_id:
          $ref: '#/components/schemas/TraceId'
    ScheduledGoal:
      type: object
      additionalProperties: false
      required: [schema_version, scheduled_goal_id, tenant_id, status, cron, input, next_run_at_utc, run_count, failure_count, budget_units, reason_codes, created_at_utc, updated_at_utc, monotonic_ms, trace_id]
      properties:
        schema_version:
          const: nexus.scheduled_goal.p7.v1
        scheduled_goal_id:
          $ref: '#/components/schemas/ScheduledGoalId'
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        user_id:
          $ref: '#/components/schemas/UserId'
        agent_id:
          $ref: '#/components/schemas/AgentId'
        conversation_id:
          $ref: '#/components/schemas/ConversationId'
        trace_id:
          $ref: '#/components/schemas/TraceId'
        status:
          $ref: '#/components/schemas/ScheduledGoalStatus'
        cron:
          type: string
          minLength: 9
          maxLength: 120
          description: Five-field UTC cron-like recurrence; seconds, years, and time zones are not supported in P7 Alpha.
        input:
          type: string
          minLength: 1
          maxLength: 64000
        next_run_at_utc:
          $ref: '#/components/schemas/Timestamp'
        last_run_at_utc:
          $ref: '#/components/schemas/Timestamp'
        last_run_status:
          $ref: '#/components/schemas/ScheduledGoalRunStatus'
        last_task_id:
          $ref: '#/components/schemas/TaskId'
        last_attempt_id:
          $ref: '#/components/schemas/AttemptId'
        last_execution_id:
          $ref: '#/components/schemas/ExecutionId'
        run_count:
          type: integer
          minimum: 0
        failure_count:
          type: integer
          minimum: 0
        budget_units:
          type: integer
          minimum: 1
        reason_codes:
          type: array
          items:
            type: string
        created_at_utc:
          $ref: '#/components/schemas/Timestamp'
        updated_at_utc:
          $ref: '#/components/schemas/Timestamp'
        monotonic_ms:
          type: integer
          minimum: 0
    ScheduledGoalList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ScheduledGoal'
        next_cursor:
          type: string
    ScheduledGoalCreateRequest:
      type: object
      additionalProperties: false
      required: [tenant_id, agent_id, conversation_id, cron, input, trace_id]
      properties:
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        user_id:
          $ref: '#/components/schemas/UserId'
        agent_id:
          $ref: '#/components/schemas/AgentId'
        conversation_id:
          $ref: '#/components/schemas/ConversationId'
        cron:
          type: string
          minLength: 9
          maxLength: 120
        input:
          type: string
          minLength: 1
          maxLength: 64000
        budget_units:
          type: integer
          minimum: 1
        trace_id:
          $ref: '#/components/schemas/TraceId'
    ScheduledGoalUpdateRequest:
      type: object
      additionalProperties: false
      required: [trace_id]
      properties:
        cron:
          type: string
          minLength: 9
          maxLength: 120
        input:
          type: string
          minLength: 1
          maxLength: 64000
        agent_id:
          $ref: '#/components/schemas/AgentId'
        conversation_id:
